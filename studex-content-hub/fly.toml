app = "studex-content-hub"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "5000"
  DATABASE_PATH = "/data/studex-content-hub.sqlite"
  META_TOKEN_EXPIRES_AT = "2026-08-04"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[mounts]
  source = "studex_content_hub_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = 1024
