app = "studex-hermes-agent"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3004"
  LLM_PROVIDER = "ollama"
  OLLAMA_MODEL = "hermes3:8b"
  CASHCLAW_URL = "http://datanetics-app.internal:3000/api/agent"

[http_service]
  internal_port = 3004
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
