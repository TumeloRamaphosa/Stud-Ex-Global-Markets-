[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:cashclaw]
command=node server.js
directory=/app/studex-frontend/.next/standalone
environment=PORT=3000,HOSTNAME=0.0.0.0,HERMES_URL=http://localhost:3004,N8N_RUNNER_URL=http://localhost:3003,MCP_META_ADS_URL=http://localhost:3002
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true

[program:mcp-meta-ads]
command=node mcp-meta-ads/src/index.js
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true

[program:n8n-runner]
command=node n8n-runner/src/index.js
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true

[program:hermes]
command=node hermes-agent/src/index.js
directory=/app
environment=PORT=3004,HERMES_PORT=3004,OLLAMA_URL=http://35.196.24.245:11434,DEFAULT_PROVIDER=ollama,OLLAMA_MODEL=hermes3:8b
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
