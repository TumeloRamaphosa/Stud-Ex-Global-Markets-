# Studex Meat — Fly.io deployment
# Single container (2GB RAM, 2 CPUs, JNB region)
# All 4 services run inside one Fly machine

app = "datanetics-app"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NODE_ENV = "production"
  N8N_RUNNER_URL = "http://localhost:3003"
  MCP_META_ADS_URL = "http://localhost:3002"
  HERMES_URL = "http://localhost:3004"
  OLLAMA_URL = "http://35.196.24.245:11434"
  OLLAMA_MODEL_HERMES = "hermes3:8b"
  OLLAMA_MODEL_CASHCLAW = "qwen3:30b"
  CASHCLAW_URL = "https://datanetics-app.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  path = "/"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = 2048
  cpus = 2
